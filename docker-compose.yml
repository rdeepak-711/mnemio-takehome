services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mnemio
      POSTGRES_PASSWORD: mnemio
      POSTGRES_DB: mnemio
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mnemio -d mnemio"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
